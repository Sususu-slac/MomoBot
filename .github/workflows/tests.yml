name: Windows tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONNOUSERSITE: '1'
      PYTHONUTF8: '1'
      MOMOBOT_STATE_ROOT: ${{ github.workspace }}/test_outputs/ci_state
      BL62_RECON_ROOT: ${{ github.workspace }}/reconstruction_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Sususu-slac/BL62_Reconstruction_GUI
          ref: v1.2.6
          path: reconstruction_backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
